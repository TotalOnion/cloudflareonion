
services:
  wordpress:
    build:
      context: .
    user: root
    container_name: gcms-cloudflareonion
    ports:
      - "8081:80"
    restart: always
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: password
      WORDPRESS_DEBUG: true
    volumes:
      - ./:/var/www/html/wp-content/plugins
    depends_on:
      - db
      - phpmyadmin
    entrypoint: ["/bin/bash", "/docker-entrypoint.sh"]

  db:
    image: mariadb:latest
    container_name: gcms-db-cloudflareonion
    restart: always
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: root
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    # ports:
    #   - "3333:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    depends_on:
      - db
    image: phpmyadmin/phpmyadmin:latest
    platform: linux/amd64
    container_name: phpmyadmin-cloudflareonion
    restart: always
    ports:
      - 8181:80
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: password

volumes:
  db_data:


