name: "gcms_plugin_version_updater_workflow 🚀"

## Description: THIS TRIGGERS ON ALL PULL REQUEST CLOSE / MERGE
## - Deletes all orphaned multidevs (multidevs without an open PR)

on:
  # Triggers the workflow when a PR is closed (merged, or just closed)
  pull_request:
    types: [ "closed" ]
    branches: [ "master","main" ]

defaults:
  run:
    shell: bash

jobs:

  Do:
    # @main will load latest version (might be unstable)
    # We recommend to always choose a specific version
    uses: irishdistillers/pipelines/.github/workflows/gcms_plugin_version_updater_workflow.yml@main
    with:
      PHP_VERSION: 8.2
    secrets:
      TERMINUS_TOKEN: ${{ secrets.TERMINUS_TOKEN }}
