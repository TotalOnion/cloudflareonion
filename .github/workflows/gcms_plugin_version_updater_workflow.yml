name: "gcms_plugin_version_updater_workflow 🚀"

## Description: THIS TRIGGERS ON ALL PULL REQUEST CLOSE / MERGE
## - XXXXXX

on:
  # Triggers the workflow when a PR is closed (merged, or just closed)
  pull_request:
    types: [ "closed" ]
    branches: [ "master","main" ]

jobs:
  build:
    name: RedisTimeSeries
    runs-on: ubuntu-latest
    steps:
      - id: KeyDB
        uses: pozetroninc/github-action-get-latest-release@master
        with:
          repository: ${{ github.repository }}
          owner: JohnSully
          repo: KeyDB
          excludes: prerelease, draft

      - name: Setup the environment
        run: |
          DEPLOYMENT_DIR="`echo $GITHUB_REPOSITORY | awk -F '/' '{printf $2}'`"
          echo "DEPLOYMENT_DIR=${DEPLOYMENT_DIR}"
          echo "DEPLOYMENT_DIR=${DEPLOYMENT_DIR}" >> $GITHUB_ENV

          LAST_VERSION="`echo ${{ steps.keydb.outputs.release }}`"
          echo "LAST_VERSION=${LAST_VERSION}"
          echo "LAST_VERSION=${LAST_VERSION}" >> $GITHUB_ENV

          # Please use GCFO_UNDEFINED_VERSION
          TMP_UNDEFINED_VERSION="0.0.7"
          echo "UNDEFINED_VERSION=${TMP_UNDEFINED_VERSION}"
          echo "UNDEFINED_VERSION=${TMP_UNDEFINED_VERSION}" >> $GITHUB_ENV

      - name: CheckOut Source Code
        uses: actions/checkout@v3
        continue-on-error: true
        with:
          ref: main
          path: ${{ env.DEPLOYMENT_DIR }}
          fetch-depth: 0
          persist-credentials: true
          set-safe-directory: true
          submodules: 'recursive'
          clean: true

      - name: Replace version in the code
        working-directory: ${{ env.DEPLOYMENT_DIR }}
        run: |
          ls -ail ./

          cp global-cfo.php /tmp/new-global-cfo.php

          sed -E "s/${UNDEFINED_VERSION}/${LAST_VERSION}/g" ./global-cfo.php > /tmp/new-global-cfo.php

          cp /tmp/new-global-cfo.php global-cfo.php

      - name: Is version is still undefined?
        working-directory: ${{ env.DEPLOYMENT_DIR }}
        run: |          
          TMP_VERIFY_VERSION="$(grep -Forni "${UNDEFINED_VERSION}" --exclude-dir=.git || true)"

          echo "searching the codebase for ${UNDEFINED_VERSION}"
          echo "-----MATCHES-----"
          echo "$TMP_VERIFY_VERSION"
          echo "-----END-----"
          
          mapfile -t MATCHED_LINES << $TMP_VERIFY_VERSION
          for line in "${MATCHED_LINES[@]}"; do
            echo ">>  $line"
          done

          TMP_COUNT_VERSIONS=$(echo -n "'$TMP_VERIFY_VERSION' | wc -l")
          if ${TMP_COUNT_VERSIONS} > 0; then
            TMP_MSG="Fail to replace all the ${UNDEFINED_VERSION} (find $TMP_VERIFY_VERSION occurrences)"
            echo "::error:: ${TMP_MSG}"
            echo "➕ ${TMP_MSG}" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

        